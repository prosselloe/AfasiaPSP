name: logopeda
description: "Afàsia PSP"
publish_to: 'none'
version: 1.0.0+25

environment:
  sdk: '>=3.2.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^2.31.0
  provider: ^6.1.2
  google_fonts: ^6.2.1
  google_generative_ai: ^0.4.7
  http: ^1.6.0
  speech_to_text: ^7.4.0
  flutter_tts: ^4.2.5
  collection: ^1.19.1
  shared_preferences: ^2.5.5
  flutter_markdown: ^0.7.7+1
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
