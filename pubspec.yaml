    - assets/images/PAGINA08/LLOCS/
    - assets/images/PAGINA09/MAPES/
    - assets/images/PAGINA10/MAPES/
    - assets/images/PAGINA10/TRANSPORT/
    - assets/images/PAGINA11/TRANSPORT/
    - assets/images/PAGINA11/VERBS/
    - assets/images/PAGINA12/VERBS/
    - assets/images/PAGINA13/MENJAR/
    - assets/images/PAGINA13/VERBS/
